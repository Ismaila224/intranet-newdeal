name: CD Pipeline - Production

on:
  push:
    branches:
      - prod

env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: latest
  DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ===============================
  # JOB 1 - SECURITY SCAN (CRITICAL BLOCK)
  # ===============================
  scan:
    name: Security Scan (Production Gate)
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull image
        run: |
          docker pull $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Run Trivy scan (BLOCK CRITICAL)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1   

  # ===============================
  # JOB 2 - DEPLOYMENT (runner_prod)
  # ===============================
  deploy:
    name: Deploy to Production Server
    needs: scan
    runs-on: self-hosted   # runner_prod

    steps:
      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull image
        run: |
          docker pull $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Stop old container
        run: |
          docker stop intranet-prod || true
          docker rm intranet-prod || true

      - name: Run container on port 80
        run: |
          docker run -d \
            -p 80:80 \
            --name intranet-prod \
            $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD Pipeline - Production Status"
          to: team@newdeal.sn
          from: GitHub Actions
          body: |
            Pipeline Production terminé.

            Statut : ${{ job.status }}

            Application déployée sur runner_prod.